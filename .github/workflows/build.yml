name: Build

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        default: zed-industries/zed
      ref:
        description: Branch/tag/ref to build
        type: string
        required: true
      build_cli:
        description: Build the CLI (zed.exe launcher)
        type: boolean
        default: true
      build_dx11:
        description: Build the Vulkan/DX11 editor variant
        type: boolean
        default: true
      build_opengl:
        description: Build the OpenGL editor variant
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        default: zed-industries/zed
      ref:
        description: Branch/tag/ref to build
        type: string
        default: main
      build_cli:
        description: Build the CLI (zed.exe launcher)
        type: boolean
        default: true
      build_dx11:
        description: Build the Vulkan/DX11 editor variant
        type: boolean
        default: true
      build_opengl:
        description: Build the OpenGL editor variant
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
    strategy:
      matrix:
        include:
          - name: cli
            build_path: crates/cli
            artifact: cli-release
            binary: cli.exe

          - name: editor-dx11
            build_path: .
            artifact: editor-dx11-release
            binary: zed.exe
            rustflags: ""

          - name: editor-opengl
            build_path: .
            artifact: editor-opengl-release
            binary: zed.exe
            rustflags: "--cfg gles"
      fail-fast: false

    steps:
      - name: Determine if this variant should build
        id: guard
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            cli) v='${{ inputs.build_cli }}' ;;
            editor-dx11) v='${{ inputs.build_dx11 }}' ;;
            editor-opengl) v='${{ inputs.build_opengl }}' ;;
            *) v='true' ;;
          esac
          echo "should_build=$v" >> "$GITHUB_OUTPUT"
          if [ "$v" != "true" ]; then
            echo "Skipping ${{ matrix.name }} build (input set to false)"
          fi

      - name: Enable long paths in Git
        if: steps.guard.outputs.should_build == 'true'
        run: git config --system core.longpaths true

      - name: Enable long paths in Windows
        if: steps.guard.outputs.should_build == 'true'
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Exclude build paths from Windows Defender
        if: steps.guard.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:TEMP"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "link.exe"
          Add-MpPreference -ExclusionProcess "lld-link.exe"
          exit 0

      - name: Checkout self
        if: steps.guard.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: Checkout Zed
        if: steps.guard.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: zed

      - name: Install rust nightly
        if: steps.guard.outputs.should_build == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          target: wasm32-wasip1

      - name: Rust Cache
        if: steps.guard.outputs.should_build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
          workspaces: "zed -> target"

      - name: Install PSToml module
        if: steps.guard.outputs.should_build == 'true'
        shell: pwsh
        run: Install-Module -Name PSToml -Scope CurrentUser -Force

      - name: Setup rustflags
        if: steps.guard.outputs.should_build == 'true'
        shell: pwsh
        run: ./scripts/Parse-Rustflags.ps1 ${{ matrix.rustflags }}

      - name: Build ${{ matrix.name }}
        if: steps.guard.outputs.should_build == 'true'
        working-directory: zed/${{ matrix.build_path }}
        env:
          ZED_UPDATE_EXPLANATION: "Please use Scoop to update Zed."
        run: cargo b -r

      - name: Upload ${{ matrix.name }}
        if: steps.guard.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: zed/target/release/${{ matrix.binary }}
